name: DULEO Professional UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  activate-ui:
    if: ${{ !contains(github.event.head_commit.message, '[duleo-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ativar CSS profissional
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="professional.css?v=1.0.0">'
          if 'professional.css' not in s:
              s = s.replace('</head>', f'    {link}\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "CSS profissional já está ativo."
            exit 0
          fi
          git commit -m "Ativar interface profissional DULEO [duleo-ui]"
          git push
