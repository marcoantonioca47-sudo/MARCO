name: DULEO UI Refresh
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[ui-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar cache dos arquivos visuais
        run: |
          sed -i 's/duleo-final-ui.css?v=1.0.0/duleo-final-ui.css?v=1.1.0/g' index.html
          sed -i 's/pro-enhancements.js?v=1.0.0/pro-enhancements.js?v=1.1.0/g' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "Cache já atualizado."; exit 0; fi
          git commit -m "Atualizar cache visual DULEO [ui-refresh]"
          git push
