name: Restaurar index DULEO
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, '[restore-index]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar index e manter atalhos profissionais
        shell: bash
        run: |
          git checkout 782aa64d12347b4506017fdf36ef250f4d3929fa -- index.html
          grep -q 'atalhos-profissionais.css' index.html || sed -i '/duleo-final-ui.css/a\    <link rel="stylesheet" href="atalhos-profissionais.css?v=1.0.0">' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restaurar index DULEO e aplicar atalhos [restore-index]"
          git push
