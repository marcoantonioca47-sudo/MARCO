name: DULEO Final UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[final-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ativar acabamento final
        shell: bash
        run: |
          grep -q 'duleo-final-ui.css' index.html || sed -i '/<\/head>/i\    <link rel="stylesheet" href="duleo-final-ui.css?v=1.0.0">' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "Acabamento já ativo."; exit 0; fi
          git commit -m "Ativar acabamento final DULEO [final-ui]"
          git push
