name: Ativar DULEO PRO
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  activate:
    if: ${{ !contains(github.event.head_commit.message, '[duleo-pro]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ativar recursos profissionais
        shell: bash
        run: |
          grep -q "professional-pro.css" professional.css || printf '\n@import url("professional-pro.css");\n' >> professional.css
          grep -q "pro-enhancements.js" index.html || sed -i '/<\/body>/i\    <script src="pro-enhancements.js?v=1.0.0"></script>' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add professional.css index.html
          if git diff --cached --quiet; then echo "DULEO PRO já está ativo."; exit 0; fi
          git commit -m "Ativar DULEO PRO [duleo-pro]"
          git push
