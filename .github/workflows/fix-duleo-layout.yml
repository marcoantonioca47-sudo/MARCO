name: Ajustar layout DULEO

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  layout:
    if: ${{ !contains(github.event.head_commit.message, '[layout-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar acabamento visual
        shell: bash
        run: |
          cat >> professional-pro.css <<'EOF'

/* =========================================================
   DULEO — ACABAMENTO FINAL DOS NOVOS RECURSOS
   Botões, barra superior e Central Executiva
========================================================= */

/* Barra superior: limpa e responsiva */
.pro-toolbar{
  display:grid !important;
  grid-template-columns:minmax(0,1fr) auto auto auto auto !important;
  align-items:center !important;
  gap:10px !important;
  padding:12px !important;
}

/* Busca */
.pro-toolbar .pro-search{
  width:100% !important;
  min-width:0 !important;
  height:44px !important;
  border:1px solid #d9e2ec !important;
  border-radius:12px !important;
  background:#fff !important;
  color:#172033 !important;
  font-size:14px !important;
}

/* Botões novos com o mesmo padrão do + Novo indicador */
.pro-toolbar .pro-chip:not(#proStatus),
.pro-command,
.pro-fab{
  font-family:inherit !important;
}

.pro-toolbar .pro-chip:not(#proStatus){
  min-height:44px !important;
  padding:0 16px !important;
  display:inline-flex !important;
  align-items:center !important;
  justify-content:center !important;
  white-space:nowrap !important;
  border:0 !important;
  border-radius:12px !important;
  background:linear-gradient(135deg,#1d6bc7,#1557a6) !important;
  color:#fff !important;
  font-size:13px !important;
  font-weight:700 !important;
  box-shadow:0 6px 16px rgba(21,87,166,.18) !important;
  cursor:pointer !important;
  transition:transform .18s ease,box-shadow .18s ease,filter .18s ease !important;
}

.pro-toolbar .pro-chip:not(#proStatus):hover{
  transform:translateY(-1px) !important;
  filter:brightness(1.04) !important;
  box-shadow:0 9px 20px rgba(21,87,166,.25) !important;
}

#proStatus{
  min-height:44px !important;
  justify-content:center !important;
  white-space:nowrap !important;
  padding:0 14px !important;
  border-radius:12px !important;
  font-size:12px !important;
  font-weight:700 !important;
}

/* Central Executiva */
.pro-executive{
  margin-top:18px !important;
  padding:22px !important;
  border:1px solid #dce5ef !important;
  border-radius:20px !important;
  background:linear-gradient(145deg,#172033 0%,#1c2940 100%) !important;
  color:#f8fafc !important;
  box-shadow:0 16px 40px rgba(15,23,42,.14) !important;
  overflow:hidden !important;
}

.pro-executive .painel-cabecalho{
  display:flex !important;
  align-items:flex-start !important;
  justify-content:space-between !important;
  gap:18px !important;
  margin-bottom:20px !important;
}

.pro-executive .eyebrow{
  color:#5da7ef !important;
  font-size:11px !important;
  font-weight:800 !important;
  letter-spacing:.13em !important;
}

.pro-executive h3{
  margin:7px 0 5px !important;
  color:#fff !important;
  font-size:21px !important;
}

.pro-executive .painel-cabecalho p{
  margin:0 !important;
  color:#9fb0c7 !important;
  font-size:13px !important;
}

.pro-executive #proExportCsv{
  flex:0 0 auto !important;
  min-height:44px !important;
  padding:0 17px !important;
  border-radius:12px !important;
  background:#fff !important;
  color:#1557a6 !important;
  border:0 !important;
  font-weight:800 !important;
}

/* KPIs: nunca deixar texto e número embolarem */
.pro-executive .pro-kpis{
  display:grid !important;
  grid-template-columns:repeat(4,minmax(0,1fr)) !important;
  gap:12px !important;
}

.pro-executive .pro-kpi{
  display:flex !important;
  flex-direction:column !important;
  align-items:flex-start !important;
  justify-content:center !important;
  min-width:0 !important;
  min-height:105px !important;
  padding:17px 18px !important;
  border:1px solid rgba(255,255,255,.09) !important;
  border-radius:15px !important;
  background:rgba(255,255,255,.055) !important;
  box-shadow:none !important;
}

.pro-executive .pro-kpi small{
  display:block !important;
  color:#9fb0c7 !important;
  font-size:10px !important;
  line-height:1.2 !important;
  white-space:nowrap !important;
}

.pro-executive .pro-kpi strong{
  display:block !important;
  margin:7px 0 0 !important;
  color:#fff !important;
  font-size:30px !important;
  line-height:1 !important;
  font-variant-numeric:tabular-nums !important;
}

.pro-executive .pro-kpi span{
  display:block !important;
  margin-top:7px !important;
  color:#9fb0c7 !important;
  font-size:11px !important;
  line-height:1.3 !important;
}

/* Atividade e saúde */
.pro-executive .pro-grid-2{
  display:grid !important;
  grid-template-columns:minmax(0,1.35fr) minmax(280px,.9fr) !important;
  gap:20px !important;
  margin-top:20px !important;
}

.pro-executive .pro-grid-2 > div{
  min-width:0 !important;
}

.pro-executive .pro-grid-2 h4{
  margin:0 0 10px !important;
  color:#fff !important;
  font-size:14px !important;
}

.pro-executive .pro-list{
  display:grid !important;
  gap:8px !important;
}

.pro-executive .pro-row{
  display:flex !important;
  align-items:center !important;
  justify-content:space-between !important;
  gap:12px !important;
  min-width:0 !important;
  min-height:48px !important;
  padding:10px 13px !important;
  border:1px solid rgba(255,255,255,.08) !important;
  border-radius:11px !important;
  background:rgba(255,255,255,.045) !important;
  box-shadow:none !important;
  transform:none !important;
}

.pro-executive .pro-row > div{
  min-width:0 !important;
}

.pro-executive .pro-row strong{
  display:block !important;
  color:#f8fafc !important;
  font-size:12px !important;
  line-height:1.35 !important;
}

.pro-executive .pro-row span{
  display:block !important;
  color:#9fb0c7 !important;
  font-size:10px !important;
  line-height:1.35 !important;
  white-space:nowrap !important;
}

.pro-executive .pro-row > span:last-child{
  flex:0 0 auto !important;
  text-align:right !important;
}

/* Modal/atalhos no mesmo padrão */
.pro-command{
  min-height:48px !important;
  border:1px solid #e4eaf1 !important;
  border-radius:12px !important;
  background:#fff !important;
  color:#172033 !important;
  font-size:13px !important;
}

/* Mobile */
@media(max-width:700px){
  .pro-toolbar{
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
    gap:8px !important;
    padding:10px !important;
  }
  .pro-toolbar .pro-search{
    grid-column:1 / -1 !important;
  }
  .pro-toolbar .pro-chip:not(#proStatus),
  #proStatus{
    width:100% !important;
    min-width:0 !important;
    padding:0 10px !important;
    font-size:12px !important;
    box-sizing:border-box !important;
  }
  .pro-executive{
    padding:17px !important;
    border-radius:17px !important;
  }
  .pro-executive .painel-cabecalho{
    display:flex !important;
    flex-direction:column !important;
    gap:12px !important;
  }
  .pro-executive #proExportCsv{
    width:100% !important;
  }
  .pro-executive .pro-kpis{
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
    gap:9px !important;
  }
  .pro-executive .pro-kpi{
    min-height:96px !important;
    padding:14px !important;
  }
  .pro-executive .pro-kpi strong{
    font-size:26px !important;
  }
  .pro-executive .pro-grid-2{
    grid-template-columns:1fr !important;
    gap:18px !important;
  }
  .pro-executive .pro-row{
    min-height:52px !important;
  }
}

@media(max-width:380px){
  .pro-executive .pro-kpis{grid-template-columns:1fr !important}
}
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add professional-pro.css
          if git diff --cached --quiet; then echo "Layout já aplicado."; exit 0; fi
          git commit -m "Aplicar acabamento dos novos recursos [layout-fix]"
          git push
